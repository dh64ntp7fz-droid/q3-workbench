<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邹慧明 · 三季度工作台</title>
<style>
:root{--bg:#f0f3f8;--card:#fff;--txt:#1e293b;--t2:#334155;--t3:#475569;--bd:#e2e8f0;--bd2:#f8fafc;--inp:#f8fafc;--chk:#cbd5e1;--dim:#f1f5f9}[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--t2:#475569;--t3:#475569;--bd:#334155;--bd2:#1a2332;--inp:#1a2332;--chk:#475569;--dim:#1a2332}body{background:var(--bg);color:var(--txt);transition:background .3s,color .3s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--txt);padding:12px 11px 48px;max-width:860px;margin:0 auto;-webkit-font-smoothing:antialiased}

.header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:16px;padding:18px 16px 14px;margin-bottom:14px;box-shadow:0 4px 16px rgba(99,102,241,.25);animation:shimmer 8s ease infinite;background-size:200% 200%!important}
.header h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.header .sub{font-size:13px;opacity:.9;margin-top:4px}
.header .quote{font-size:12px;opacity:.75;margin-top:8px;font-style:italic}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-card .l{font-size:12px;color:var(--t3);font-weight:600}
.stat-card .v{font-size:22px;font-weight:800;margin-top:1px;line-height:1.2}
.stat-card.red .v{color:#ef4444}
.stat-card.green .v{color:#10b981}
.stat-card.blue .v{color:#6366f1}
.stat-card.purple .v{color:#8b5cf6}
.stat-card .v .sub{font-size:12px;font-weight:400;color:#94a3b8}
.stat-bar{height:3px;background:var(--dim);border-radius:4px;margin-top:5px;overflow:hidden}
.stat-bar .fill{height:100%;border-radius:4px;transition:width .6s ease}

.hint{font-size:13px;font-weight:700;color:var(--t2);margin:16px 0 6px;letter-spacing:.3px}

.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.995)}
.grp-head{font-size:13px;font-weight:700;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.grp-head .prog{font-size:12px;opacity:.85}
.grp-head .cyc{font-size:11px;opacity:.75;font-weight:400}

.grp-must .grp-head{background:linear-gradient(135deg,#ef4444,#f87171)}
.grp-daily .grp-head{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.grp-weekly .grp-head{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#5c3d06}
.grp-biweekly .grp-head{background:linear-gradient(135deg,#ec4899,#f472b6)}
.grp-monthly .grp-head{background:linear-gradient(135deg,#6366f1,#818cf8)}

.row{display:flex;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--bd2);min-height:48px;cursor:pointer;user-select:none;transition:background .15s,transform .1s}
.row:last-child{border-bottom:none}
.row:active{background:#f8fafc}
.row.done{background:#f0fdf4}
.row.done .r-t{text-decoration:line-through;color:#94a3b8}
.row.done .r-d{color:#cbd5e1}

.ck{width:24px;height:24px;min-width:24px;border:2px solid var(--chk);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:2px 12px 0 0;font-size:13px;color:#fff;background:#fff;transition:.25s cubic-bezier(.4,0,.2,1)}
.row.done .ck{border-color:#10b981;background:#10b981;transform:scale(1.1)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1.05)}}
.row.done .ck{animation:pop .3s ease}

.r-b{flex:1;min-width:0}
.r-t{font-size:14px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.r-d{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.45}
.r-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{font-size:10px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tg.who{background:#fef3c7;color:#92400e;font-weight:600}
.tg.tab{background:var(--dim);color:#64748b}
.tg.stamp{background:#10b981;color:#fff}
.tg.fine{background:#ef4444;color:#fff;font-weight:700}

.row.must-fine{border-left:4px solid #ef4444}
.row.must-fine.done{border-left-color:#10b981}

.edit-btn{background:none;border:none;font-size:14px;cursor:pointer;padding:9px 11px;border-radius:10px;color:#64748b;transition:.2s;flex-shrink:0;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.edit-btn:hover{color:var(--t2);background:#f1f5f9}
.sv-resend-btn{background:none;border:1.5px solid #6366f1;font-size:13px;cursor:pointer;padding:7px 10px;border-radius:8px;color:#6366f1;font-weight:700;transition:.2s;flex-shrink:0;white-space:nowrap}
.sv-resend-btn:hover{background:#6366f1;color:#fff}

.dl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:background .15s;min-height:48px}
.dl:last-child{border-bottom:none}
.dl.done{background:#f0fdf4}.dl.done .dl-t{text-decoration:line-through;color:#94a3b8}.dl.done .dl-m{color:#94a3b8}.dl.done .ck{border-color:#10b981;background:#10b981;animation:pop .3s ease}
.dl:active{background:#f8fafc}
.dl-n{text-align:center;min-width:46px;flex-shrink:0}
.dl-n .num{font-size:22px;font-weight:800;line-height:1;color:#f59e0b}
.dl-n .u{font-size:9px;color:#94a3b8}
.dl.done .dl-n .num{font-size:15px;color:#10b981}
.dl.over .dl-n .num{color:#ef4444}
.dl.soon .dl-n .num{color:#ef4444}
.dl-i{flex:1;min-width:0}
.dl-t{font-size:13px;font-weight:700}
.dl-m{font-size:10px;color:var(--t3);margin-top:2px}
.dl-c{width:24px;height:24px;min-width:24px;border:2px solid var(--chk);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;background:#fff;transition:.25s}
.dl.done .dl-c{border-color:#10b981;background:#10b981}
.evt .dl-n .num{color:#6366f1;font-size:16px}

/* Temp tasks */
.temp-form{display:flex;gap:8px;padding:8px 14px;border-bottom:2px solid #f1f5f9}
.temp-form input{flex:1;border:2px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;transition:.2s}
.temp-form input:focus{border-color:#6366f1}
.temp-form button{width:40px;min-width:40px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-weight:700;font-size:20px;cursor:pointer;transition:.2s}
.temp-form button:active{transform:scale(.92)}
.temp-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd2);font-size:13px;gap:8px;transition:background .15s}
.temp-item .ti-ck{width:22px;height:22px;min-width:22px;border:2px solid var(--chk);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff;transition:.2s}
.temp-item.done .ti-ck{border-color:#10b981;background:#10b981;color:#fff}
.temp-item.done{background:#f0fdf4}
.temp-item.done span{text-decoration:line-through;color:#94a3b8}

/* Store visit */
.sv-card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:12px}
.sv-card select,.sv-card textarea,.sv-card input{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:13px;background:var(--inp);color:var(--txt);font-family:inherit;margin-bottom:8px;transition:.2s}
.sv-card select:focus,.sv-card textarea:focus,.sv-card input:focus{border-color:#6366f1;outline:none}
.sv-card textarea{min-height:50px;resize:vertical}
.sv-label{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:3px;display:block}
.sv-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.sv-ck{width:22px;height:22px;min-width:22px;border:2px solid var(--chk);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;cursor:pointer;background:#fff;transition:.2s}
.sv-ck.checked{border-color:#10b981;background:#10b981;color:#fff}
.sv-submit{width:100%;padding:11px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;transition:.2s;box-shadow:0 4px 12px rgba(99,102,241,.25)}
.sv-submit:active{transform:scale(.97)}
.sv-hist-item{font-size:12px;padding:7px 10px;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.ledger-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd2);font-size:13px}
.ledger-item:last-child{border-bottom:none}
.lg-cnt{font-weight:800;color:#6366f1;font-size:17px}
.lg-note{font-size:10px;color:#cbd5e1;text-align:center;padding:6px}

.btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1;min-width:70px;background:#fff;border:1.5px solid #e2e8f0;color:var(--t2);font-size:13px;padding:12px 8px;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btns button:active{background:var(--dim);transform:scale(.96)}
.foot{text-align:center;font-size:12px;color:#94a3b8;margin-top:12px;line-height:1.6}

.toast-wrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.toast-wrap.show{display:flex}
.toast-box{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:48px 40px;border-radius:24px;font-size:28px;font-weight:800;text-align:center;max-width:88%;box-shadow:0 24px 80px rgba(99,102,241,.5);line-height:1.5;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both}
.toast-box .sub{font-size:14px;font-weight:400;opacity:.8;margin-top:12px;display:block}
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}


@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card,.sv-card{animation:fadeIn .4s ease both}
.card:nth-child(2){animation-delay:.04s}

@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}body{padding:16px 16px 64px}}
@media print{body{background:#fff;padding:0;color:#000}.header,.hint,.btns,.stats,.temp-form,.sv-card,.toast,.tabbar{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.page{display:block!important}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.toast.show{font-size:15px;padding:14px 28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 32px rgba(99,102,241,.4)}

[data-theme="dark"] #svZone [style*="background:#fff"]{background:var(--card)!important}
[data-theme="dark"] #svZone [style*="background:#f8fafc"]{background:var(--inp)!important}
[data-theme="dark"] #svZone [style*="color:#1e293b"]{color:var(--txt)!important}
[data-theme="dark"] #svZone [style*="color:#64748b"]{color:var(--t2)!important}
[data-theme="dark"] #svZone [style*="color:#94a3b8"]{color:var(--t3)!important}
[data-theme="dark"] #tempZone div[style*="background:#f8fafc"]{background:var(--inp)!important;color:var(--txt)!important}

.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center}
.settings-overlay.show{display:flex}
.settings-panel{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto}
.settings-panel h3{font-size:16px;margin-bottom:16px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:13px}
.settings-toggle{width:48px;height:26px;border-radius:13px;cursor:pointer;position:relative;transition:.2s;border:none;flex-shrink:0;margin-left:8px}
.settings-toggle.on{background:#10b981}.settings-toggle.off{background:#cbd5e1}
.settings-toggle::after{content:'';position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.settings-toggle.on::after{left:25px}.settings-toggle.off::after{left:3px}
.settings-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;padding:4px 8px}
.settings-close{width:100%;padding:10px;border:none;border-radius:10px;background:#f1f5f9;font-weight:700;margin-top:12px;cursor:pointer;font-size:14px}
.gear-btn{background:none;border:none;font-size:15px;cursor:pointer;padding:4px 8px;opacity:.7;transition:.2s;color:#fff;min-width:36px;min-height:36px}

/* ── 情绪价值 ── */
@keyframes floatUp{0%{transform:translateY(0) scale(0);opacity:0}20%{transform:translateY(-10px) scale(1);opacity:1}100%{transform:translateY(-160px) scale(.3);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes streakGlow{0%,100%{box-shadow:0 0 8px rgba(251,191,36,.3)}50%{box-shadow:0 0 20px rgba(251,191,36,.6)}}

/* ── 分页 Tab ── */
.page{display:none}
.page.active{display:block;animation:fadeIn .25s ease}
.tabbar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:500px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;display:flex;z-index:999;padding:6px;box-shadow:0 8px 28px rgba(99,102,241,.22),0 2px 8px rgba(0,0,0,.06);border:1px solid rgba(255,255,255,.6)}
[data-theme="dark"] .tabbar{background:rgba(30,41,59,.92);border-color:rgba(51,65,85,.5)}
.tabbtn{flex:1;border:none;background:none;cursor:pointer;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#64748b;transition:.25s;border-radius:16px;-webkit-tap-highlight-color:transparent}
.tabbtn .ic{font-size:19px;line-height:1;filter:grayscale(.3);transition:.25s}
.tabbtn .lb{font-size:11px;font-weight:600;letter-spacing:.5px}
.tabbtn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.tabbtn.active .ic{filter:none;transform:scale(1.12)}
.tabbtn.active .lb{font-weight:800}
[data-theme="dark"] .tabbtn{color:#94a3b8}
[data-theme="dark"] .btns button{background:#1e293b;border-color:#334155;color:#cbd5e1}
[data-theme="dark"] .edit-btn{color:#94a3b8}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ── 2026-08-16 统一规范：字号/卡片/行对齐（单用户移动端） ── */
[style*="font-size:9px"]{font-size:12px!important}
[style*="font-size:10px"]{font-size:12px!important}
[style*="font-size:11px"]{font-size:12px!important}
[style*="font-size:12px"]{font-size:13px!important}
[style*="font-size:13px"]{font-size:14px!important}
[style*="font-size:18px"]{font-size:16px!important}
[style*="font-size:22px"]{font-size:20px!important}
[style*="border-radius:12px"][style*="box-shadow:0 1px 3px rgba(0,0,0,.04)"]{border-radius:14px!important;box-shadow:0 1px 4px rgba(15,23,42,.05)!important;background:var(--card)!important}
[style*="padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)"]{padding:14px 16px!important;border-radius:14px!important;margin-bottom:12px!important}
.row{min-height:48px;padding:10px 14px;align-items:center}
.r-t{font-size:14px}
.r-d{font-size:12px;line-height:1.45}
.tg{font-size:12px;padding:2px 8px}
.sv-item{padding:9px 0;gap:10px}
.sv-ck{width:24px;height:24px;min-width:24px;border-radius:7px}
.sv-label{font-size:12px}
.sv-hist-item{font-size:13px;padding:9px 10px}
.temp-item{min-height:44px}
.temp-item .ti-ck{width:24px;height:24px;min-width:24px;border-radius:7px}
.temp-form{padding:10px 14px}
.temp-form input{font-size:14px;padding:11px 12px}
.grp-head{padding:12px 14px}
.grp-head .prog{font-size:12px}
.grp-head .cyc{font-size:12px}
.stat-card{padding:12px 14px}
.dl-m{font-size:12px!important;color:var(--t3);margin-top:2px;line-height:1.4}
.dl-n .u{font-size:12px!important;color:#94a3b8}
.lg-note{font-size:12px!important}
.stat-card .v{font-size:20px}



/* ── 2026-08-16 紧凑模式：收紧行距，缩短页面 ── */
body{padding-top:10px!important;padding-bottom:78px!important}
.header{padding:10px 16px 8px!important;margin-bottom:6px!important}
.header .sub{margin-top:2px!important}
.header .quote{margin-top:4px!important}
.hint{margin:10px 2px 3px!important}
.card,.sv-card{margin-bottom:8px!important}
.sv-card{padding:10px 12px!important}
.grp-head{padding:9px 14px!important}
.grp-head .prog{font-size:12px!important}
.row{min-height:40px!important;padding:7px 14px!important}
.r-d{margin-top:1px!important}
.r-tags{margin-top:2px!important}
.stat-card{padding:10px 12px!important}
.stat-card .v{font-size:19px!important}
.stat-bar{margin-top:4px!important}
.sv-submit{min-height:44px!important;padding:9px!important;margin-top:4px!important;font-size:15px!important}
[style*="min-height:110px"]{min-height:70px!important}
[style*="padding:8px 0;border-bottom:1px dashed #e2e8f0"]{padding:4px 0!important}
.temp-form{padding:7px 12px!important}
.temp-form input{padding:8px 10px!important;font-size:14px!important}
.temp-item{min-height:36px!important;padding:6px 12px!important}
.sv-item{padding:5px 0!important}
.sv-hist-item{padding:6px 8px!important}
.sv-card select,.sv-card textarea,.sv-card input{padding:7px 9px!important;margin-bottom:5px!important}


/* ── 2026-08-16 再紧凑一轮：记录页一页放下 ── */
body{padding-top:8px!important}
.hint{margin:8px 2px 3px!important}
.row{min-height:38px!important;padding:6px 14px!important}
.grp-head{padding:8px 14px!important}
.stat-card{padding:9px 12px!important}
.stat-card .v{font-size:18px!important}
.sv-submit{min-height:40px!important;padding:8px!important}
[style*="min-height:110px"]{min-height:56px!important}
[style*="min-height:72px"]{min-height:56px!important}
[style*="margin-top:10px;flex-wrap:wrap"]{margin-top:4px!important}
[style*="display:flex;gap:8px;margin-top:8px"]{margin-top:4px!important}
[style*="padding:8px 14px 4px"]{padding:4px 14px 2px!important}
[style*="padding:8px 0;border-bottom:1px dashed #e2e8f0"]{padding:3px 0!important}
.sv-hist-item{padding:4px 8px!important}
.temp-item{min-height:34px!important;padding:5px 12px!important}
.sv-item{padding:4px 0!important}


/* ── 2026-08-16 记录页对齐 ── */
#drZone{padding:12px 14px!important}
#drInput{min-height:180px!important;padding:12px 14px!important;font-size:15px!important}#evtDesc{min-height:120px!important;padding:12px 14px!important;font-size:15px!important}
#drList{margin-top:8px!important}


/* ── 2026-08-16 计划页大改造：进度条与未完成优先 ── */
.plan-overview{padding:12px 16px;margin-bottom:12px}
.po-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.po-num{font-size:15px;color:var(--t2)}
.po-num b{font-size:20px}
#planOverview .grp-bar{margin:8px 0 0}
.grp-bar{height:4px;background:var(--dim);border-radius:2px;margin:0 14px 6px;overflow:hidden}

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekStr(){const d=new Date();const y=d.getFullYear();const d0=new Date(y,0,1);return y+'-W'+String(Math.ceil(((d-d0)/86400000+d0.getDay()+1)/7)).padStart(2,'0')}
function monthStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function daysLeft(due){const d=new Date(due);d.setHours(0,0,0,0);return Math.round((d-new Date(new Date().setHours(0,0,0,0)))/86400000)}


const ALL_ITEMS = { must: MUST, wact: WACT, cycle: CYCLES, dl: DEADLINES };
const CAT_NAMES = { must: '日交付', wact: '周交付', cycle: '月交付', dl: '季度交付' };
function openSettings(cat){var s=load();s.pushItems=s.pushItems||{};document.getElementById('settingsTitle').textContent='⚙ '+(CAT_NAMES[cat]||'')+' 设置';var html='';var flat=[];if(cat==='cycle'){CYCLES.forEach(function(g){g.tasks&&g.tasks.forEach(function(t){flat.push(t);});});}else if(cat==='dl'){flat=DEADLINES;}else{flat=ALL_ITEMS[cat]||[];}flat.forEach(function(it){var id=it.id;var label=it.title||it.text||'';var isPush=s.pushItems[id];html+='<div class="settings-row"><span>'+label+'</span><button class="settings-toggle '+(isPush?'on':'off')+'" onclick="togglePush(&apos;'+id+'&apos;,&apos;'+cat+'&apos;)"></button><button class="settings-del" onclick="deleteItem(&apos;'+id+'&apos;,&apos;'+cat+'&apos;)">✕</button></div>';});document.getElementById('settingsItems').innerHTML=html||'<div style="padding:10px;color:#94a3b8;text-align:center">暂无项目</div>';document.getElementById('settingsOverlay').classList.add('show');}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('show');}
function togglePush(id,cat){var s=load();s.pushItems=s.pushItems||{};if(s.pushItems[id])delete s.pushItems[id];else s.pushItems[id]=true;save(s);openSettings(cat);}
function deleteItem(id,cat){if(!confirm('确定删除？'))return;var s=load();s.delIds=s.delIds||[];s.delIds.push(id);save(s);renderAll();closeSettings();}
function getPushSummary(){var s=load();s.pushItems=s.pushItems||{};var t=todayStr();var items=[];MUST.forEach(function(m){if(s.pushItems[m.id]&&s.mu&&s.mu[m.id]===t)items.push((s.cust&&s.cust[m.id])||m.title);});WACT.forEach(function(w){if(s.pushItems[w.id]&&s.wk&&s.wk[w.id]===weekStr())items.push((s.cust&&s.cust[w.id])||w.text);});return items.length?'✅ '+items.join('\n✅ '):'暂无';}

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}fetch('/dashboard/api/workflow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...s,_t:Date.now()})}).catch(()=>{})}
function toast(msg,isBig){
  const wrap=document.getElementById('toastWrap');
  const box=document.getElementById('toastBox');
  if(isBig){
    const emoji=['🎉','🎊','✨','💫','🌟','⭐','🔥','💪','🏆'];
    const bigEmoji=emoji[Math.floor(Math.random()*emoji.length)];
    box.innerHTML=msg+'<span class="sub">邹慧明 · 今天也很棒 ✨</span>';
    box.style.fontSize=window.innerWidth<480?'22px':'28px';
    wrap.classList.add('show');
    clearTimeout(wrap._to);
    wrap._to=setTimeout(()=>wrap.classList.remove('show'),6000);
  }else{
    const old=document.getElementById('toastOld');
    if(!old){
      const el=document.createElement('div');
      el.id='toastOld';el.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:10000;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.15)';
      document.body.appendChild(el);
    }
    const t=document.getElementById('toastOld');
    t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);
    t._to=setTimeout(()=>t.style.opacity='0',2500);
  }
}
function closeBigToast(){document.getElementById('toastWrap').classList.remove('show')}
const C_MSGS=['👏 漂亮！又搞定一个','📖 做正确的事，比正确地做事更重要','🎯 准！赵总看到得加分','📖 把重要的事放在前面，一次只做一件','💎 小事做到位，大事自然成','📖 管理者要问：我能贡献什么？','🏆 你就是Q3最稳的小区经理','📖 卓有成效，从管理自己开始'];
const BIG_MSGS=['🏆🏆🏆 全部完成！卓有成效的一天 🏆🏆🏆','🔥🔥 全部清空！管理者最有效的成果就是执行力 🔥🔥','💪💪 今日事今日毕，这就是卓有成效 💪💪','🎉🎉 优秀！做正确的事，今天你做到了 🎉🎉'];
function emoToast(){
  const s=load();const t=todayStr();const muDone=MUST.filter(m=>s.mu[m.id]===t).length;
  let msg;
  if(muDone===MUST.length){
    msg=BIG_MSGS[Math.floor(Math.random()*BIG_MSGS.length)];
    confetti();
    setTimeout(()=>toast(msg,true),200);
  }else{
    msg=C_MSGS[Math.floor(Math.random()*C_MSGS.length)];
    toast(msg,true);
  }
}
function confetti(){
  for(let i=0;i<20;i++){
    const e=document.createElement('div');
    e.textContent=['🎉','🎊','✨','💫','🌟','⭐','🔥','💪'][Math.floor(Math.random()*8)];
    e.style.cssText='position:fixed;z-index:9999;font-size:'+(16+Math.random()*24)+'px;pointer-events:none;left:'+(Math.random()*90+5)+'vw;top:-20px;animation:confettiFall '+(1.5+Math.random()*2)+'s ease-out forwards;animation-delay:'+(Math.random()*0.8)+'s';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),3000);
  }
}

// Toggles
function tMust(id){
  const s=load();s.mu=s.mu||{};const t=todayStr();
  if(s.mu[id]===t)delete s.mu[id];else s.mu[id]=t;
  save(s);bumpLedger(id);renderAll();emoToast();
}
function tWact(id){
  const s=load();s.wk=s.wk||{};const cur=weekStr();
  if(s.wk[id]===cur)delete s.wk[id];else s.wk[id]=cur;
  save(s);renderAll();emoToast();
}
function tCycle(id,k){
  const s=load();s.cy=s.cy||{};const cur=k==='monthly'?monthStr():weekStr();
  if(s.cy[id]&&s.cy[id].p===cur)delete s.cy[id];
  else s.cy[id]={p:cur,d:todayStr()};
  save(s);renderAll();emoToast();
}
function tDl(id){
  const s=load();s.dl=s.dl||{};
  if(s.dl[id])delete s.dl[id];else s.dl[id]=todayStr();
  save(s);renderAll();emoToast();
}
function bumpLedger(id){
  const s=load();s.lg=s.lg||{};const t=todayStr();s.lgd=s.lgd||{};
  if(s.mu&&s.mu[id]===t&&s.lgd[id]!==t){s.lg[id]=(s.lg[id]||0)+1;s.lgd[id]=t;save(s);}
}

// Edit & Delete
function findCycleItem(id){for(const c of CYCLES)for(const t of c.tasks)if(t.id===id)return t;return null}
function findDL(id){return DEADLINES.find(d=>d.id===id)}
function editDL(id){
  const s=load();const d=findDL(id);if(!d)return;
  const nt=prompt('修改标题：',d.title);if(nt===null)return;
  s.cust2=s.cust2||{};s.cust2[id]=nt.trim();save(s);renderAll();toast('✅ 已更新');
}
function editText(id,type){
  const s=load();
  let item;
  if(type==='cycle'){item=findCycleItem(id);}
  else{const arr=type==='must'?MUST:type==='daily'?DAILY:WACT;item=arr.find(x=>x.id===id);}
  if(!item)return;
  const cur=s.cust&&s.cust[id]||item.text||item.title||'';
  const nt=prompt('修改名称：',cur);if(nt===null)return;
  s.cust=s.cust||{};s.cust[id]=nt.trim();save(s);renderAll();toast('✅ 已更新');
}
function delAny(id){if(!confirm('确定删除？'))return;const s=load();s.delIds=s.delIds||[];s.delIds.push(id);save(s);renderAll();toast('已删除');}
function delItem(id,type){
  const s=load();
  const label=s.cust&&s.cust[id]||id;
  if(!confirm('确定删除「'+label+'」?'))return;
  s.delIds=s.delIds||[];s.delIds.push(id);save(s);renderAll();toast('已删除');
}

function svSave(withPush){
  const s=load();s.sv=s.sv||[];
  // wenti 自动去重（去标点归一化比较，保留首条；分类标题行保留）
  const _norm=l=>l.replace(/[。，、；：！？\s]/g,'');
  const _wlines=(svDraft.notes.wenti||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const _seen=new Set();const _dedup=[];
  _wlines.forEach(l=>{
    if(/^【.+】$/.test(l)){_dedup.push(l);return;}
    const key=_norm(l.replace(/^\d+\//,''));
    if(!_seen.has(key)){_seen.add(key);_dedup.push(l);}
  });
  svDraft.notes.wenti=_dedup.join('\n');
  const totalChecks=Object.values(svDraft.checks).filter(Boolean).length;
  const totalItems=Object.values(svDraft.checks).length;
  const noteSummary=[];
  Object.keys(svDraft.notes).forEach(id=>{if(svDraft.notes[id])noteSummary.push(id+':'+svDraft.notes[id].substring(0,40));});
  const record={store:svDraft.store,date:todayStr(),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),checks:{...svDraft.checks},notes:{...svDraft.notes},numbers:{...svDraft.numbers},resolved:svDraft.resolved,checkCount:totalChecks,summary:noteSummary.join('; '),ts:Date.now()};
  const ed=svDraft.editing;
  if(ed){
    // 编辑态：原地更新原记录（保留原 date/time/store 作为去重key）
    const idx=s.sv.findIndex(r=>r.date===ed.date&&r.time===ed.time&&r.store===ed.store);
    if(idx>=0){
      const old=s.sv[idx];
      record.date=old.date;record.time=old.time;record.store=old.store;
      s.sv[idx]={...old,...record};
    }else{
      s.sv.unshift(record);
    }
    delete svDraft.editing;
  }else{
    s.sv.unshift(record);
  }
  if(s.sv.length>30)s.sv=s.sv.slice(0,30);
  save(s);
  localStorage.setItem('zm_sv_draft',JSON.stringify(svDraft));

  if(!withPush){toast('✅ 已保存记录（未推送）');renderSV();return;}

  // Send to WeChat Work webhook
  const WECOM_URL='https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=4eb139cc-e9ef-462d-8ef0-8559e4b94ba1';
  const now=new Date().toLocaleString('zh-CN');
  let bulletList=SV_DIMENSIONS.map(dim=>{
    const dimLabel=dim.label.replace('🌀','').replace('🍽️','').replace('🧹','').replace('【','').replace('】','').replace('🍽','').trim();
    let section=dimLabel+'\n';
    section+=dim.items.map(it=>{
      let lines='';
      if(it.checks){
        lines=it.checks.map(ch=>{
          const prefix=(ch.text==='达标'||ch.text==='达标？') ? it.label+'→' : '';
          return prefix+ch.text.substring(0,22)+'：'+(record.checks[ch.key]?'✓':'✗');
        }).join('\n');
      }
      if(it.type==='number'){
        lines=it.label+'：'+((record.numbers||{})[it.key]||'未填')+it.unit;
      }
      if(it.type==='text'){
        const txt=(record.notes||{})[it.key];
        lines=it.label+'：'+(txt?txt.substring(0,40):'未填');
      }
      const noteKey='note_'+it.id;
      const noteVal=(record.notes||{})[noteKey];
      if(noteVal)lines+='  ⚡备注：'+noteVal.substring(0,40);
      return lines;
    }).filter(Boolean).join('\n');
    return section;
  }).join('\n\n');
  fetch('/dashboard/api/send-wecom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    store:record.store,date:record.date,time:record.time,
    checkCount:totalChecks,totalItems:totalItems,
    resolved:svDraft.resolved||'',
    notes:{zhenggai:svDraft.notes.zhenggai||'',wenti:svDraft.notes.wenti||'',daijiao:svDraft.notes.daijiao||''},
    bulletList:bulletList,pushSummary:getPushSummary()
  })}).then(r=>r.json()).then(j=>{
    if(j.errcode===0)toast('✅ 已保存并推送至企业微信');
    else toast('✅ 已保存（推送失败:'+j.errmsg+'）');
  }).catch(e=>{toast('✅ 已保存（推送失败）')});

  renderSV();
}

  fetch('/dashboard/api/workflow').then(function(r2){return r2.json()}).then(function(j){
    const sv=(j.data&&j.data.sv)||[];
    const rec=sv.find(x=>x.date===r.date&&x.time===r.time&&x.store===r.store)||r;

function doResend(r){
  let bullet='';
  SV_DIMENSIONS.forEach(function(dim){
    bullet+=dim.label+'\n';
    dim.items.forEach(function(it){
      if(it.checks)it.checks.forEach(function(ch){bullet+=(ch.text==='达标'?it.label+'→':'')+ch.text.substring(0,22)+'：'+(r.checks[ch.key]?'✓':'✗')+'\n';});
      if(it.type==='number')bullet+=it.label+'：'+((r.numbers||{})[it.key]||'未填')+it.unit+'\n';
      if(it.type==='text')bullet+=it.label+'：'+((r.notes||{})[it.key]||'未填').substring(0,40)+'\n';
    });
  });
  var n=r.notes||{};
  fetch('/dashboard/api/send-wecom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    store:r.store,date:r.date,time:r.time,checkCount:r.checkCount||0,totalItems:Object.values(r.checks).length,
    resolved:r.resolved||'',notes:{zhenggai:n.zhenggai||'',wenti:n.wenti||'',daijiao:n.daijiao||''},
    bulletList:bullet,pushSummary:''
  })}).then(function(r2){return r2.json()}).then(function(j){
    if(j.errcode===0)toast('✅ 已重发至企业微信（服务器最新内容）');
    else toast('❌ 重发失败:'+(j.errmsg||''));
  }).catch(function(){toast('❌ 重发失败，网络错误')});
}

  lz+=rg('🔴 已超期/今天',groups.urgent);

const EVT_NAME='邹慧明';

let evtEditingId=null;

function evtSave(){

  const s=load();s.evt=s.evt||[];

function evtDel(id){

  const s=load();s.evt=s.evt||[];

function evtFormatTxt(e){
  const y=parseInt((e.date||'').slice(0,4))||new Date().getFullYear();
  const m=parseInt((e.date||'').slice(5,7))||(new Date().getMonth()+1);
  const n=s_evtSeq(e);
  return '【事件'+n+'】'+y+'年'+m+'月，'+EVT_NAME+'。\n'+((e.desc||''));
}
function s_evtSeq(e){
  const s=load();s.evt=s.evt||[];
  const month=(e.date||'').slice(0,7);
  const inList=s.evt.some(x=>x.id===e.id);
  if(!inList){
    // 未保存的草稿：当月条数+1
    return s.evt.filter(x=>(x.date||'').slice(0,7)===month).length+1;
  }
  return s.evt.filter(x=>(x.date||'').slice(0,7)===month&&x.ts>=e.ts).length;
}

  const localSv=Array.isArray(local.sv)?local.sv:[];
  const skey=r=>r.date+'_'+r.time+'_'+r.store;
  const delSet=new Set([...(Array.isArray(server.svDeleted)?server.svDeleted:[]),...(Array.isArray(local.svDeleted)?local.svDeleted:[])]);
  // sv 按 key 合并，同 key 取 ts 较新者（支持编辑更新），墓碑剔除已删
  const svByKey=new Map();
  [...serverSv,...localSv].forEach(r=>{
    const k=skey(r);
    if(delSet.has(k))return;
    const old=svByKey.get(k);
    if(!old||(r.ts||0)>(old.ts||0))svByKey.set(k,r);
  });
  merged.sv=[...svByKey.values()].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30);
  if(Array.isArray(local.svDeleted)&&local.svDeleted.length){
    merged.svDeleted=Array.from(new Set([...(Array.isArray(server.svDeleted)?server.svDeleted:[]),...local.svDeleted])).slice(-50);
  }
  // evt 数组按 id 合并，同 id 取 ts 较新者（支持编辑更新），墓碑剔除已删
  const serverEvt=Array.isArray(server.evt)?server.evt:[];
  const localEvt=Array.isArray(local.evt)?local.evt:[];
  const evtDelSet=new Set([...(Array.isArray(server.evtDeleted)?server.evtDeleted:[]),...(Array.isArray(local.evtDeleted)?local.evtDeleted:[])]);
  const evtById=new Map();
  [...serverEvt,...localEvt].forEach(e=>{
    if(!e.id||evtDelSet.has(e.id))return;
    const old=evtById.get(e.id);
    if(!old||(e.ts||0)>(old.ts||0))evtById.set(e.id,e);
  });
  merged.evt=[...evtById.values()].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,200);
  if(Array.isArray(local.evtDeleted)&&local.evtDeleted.length){
    merged.evtDeleted=Array.from(new Set([...(Array.isArray(server.evtDeleted)?server.evtDeleted:[]),...local.evtDeleted])).slice(-100);
  }
  ['mu','dy','wk','cy','dl','lg','lgd','tm','cust','cust2','pushItems','dr'].forEach(k=>{
    if(local[k]&&typeof local[k]==='object'&&!Array.isArray(local[k])){
      merged[k]={...(server[k]||{}),...local[k]};
    }
  });
  if(Array.isArray(local.delIds)&&local.delIds.length){
    merged.delIds=Array.from(new Set([...merged.delIds,...local.delIds]));
  }
  return merged;
}

let drSaving=false;
async function drSave(){
  if(drSaving){toast('正在保存，请稍候…');return;}
  const ta=document.getElementById('drInput');const raw=(ta?ta.value:'').trim();
  if(!raw){toast('先写点内容再保存');return;}
  // 以服务器最新数据为准，避免本地旧缓存覆盖/丢内容
  let srv={};
  try{const r=await fetch('/dashboard/api/workflow');const j=await r.json();srv=(j.data&&j.data.dr)||{};}catch(e){}
  // 日期识别：raw 里含 X月X日 → 归入该日期；否则存今天
  let t=todayStr();
  const m=raw.match(/(\d{1,2})月(\d{1,2})日/);
  if(m){
    const y=new Date().getFullYear();
    const mm=String(parseInt(m[1],10)).padStart(2,'0');
    const dd=String(parseInt(m[2],10)).padStart(2,'0');
    t=y+'-'+mm+'-'+dd;
  }
  const old=srv[t]||{};
  // 追加模式：同一天多次保存=接在后面，绝不覆盖丢内容
  const prevRaw=(old.raw||'').trim();
  // 行级去重：与已有记录完全相同的行不再重复追加（零散记录防重复）
  const prevLines=new Set(prevRaw?prevRaw.split('\n').map(l=>l.trim()).filter(Boolean):[]);
  const freshLines=raw.split('\n').map(l=>l.trim()).filter(Boolean).filter(l=>!prevLines.has(l));
  if(!freshLines.length){toast('⚠️ 内容与已有记录完全重复，未追加');return;}
  const newRaw=prevRaw?(prevRaw+'\n'+freshLines.join('\n')):freshLines.join('\n');
  const dupCnt=raw.split('\n').map(l=>l.trim()).filter(Boolean).length-freshLines.length;
  // 防重复点击：保存期间锁住按钮
  drSaving=true;
  const btn=document.getElementById('drSaveBtn');
  if(btn){btn.disabled=true;btn.style.opacity=.55;btn.style.pointerEvents='none';}
  const newDr={...srv,[t]:{raw:newRaw,savedAt:Date.now(),updatedAt:Date.now(),dirty:true,cleaned:old.cleaned||''}};
  try{
    await fetch('/dashboard/api/workflow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dr:newDr})});
  }catch(e){drSaving=false;if(btn){btn.disabled=false;btn.style.opacity=1;btn.style.pointerEvents='auto';}toast('保存失败，请重试');return;}
  // 同步本地缓存，避免旧缓存下次覆盖服务器
  const s=load();s.dr=newDr;save(s);
  const cnt=newRaw.length;
  try{localStorage.setItem('zm_dr_input_cleared','0');}catch(e){}
  drSaving=false;
  if(btn){btn.disabled=false;btn.style.opacity=1;btn.style.pointerEvents='auto';}
  drCheckTs=0;drIssueState=null;   // 日报有更新，重置驻店提示条检测，下次进巡店页立即同步最新问题点
  toast('✅ 已追加到 '+t+'（共'+cnt+'字）'+(dupCnt?'，已跳过 '+dupCnt+' 行重复':'')+(m?'，按内容日期归属':''));
  setTimeout(drLoad,300);
}
function drAutoFormat(raw){
  if(!raw)return '';
  const lines=raw.split('\n').map(l=>drCleanTalk(l)).filter(Boolean);
  let date='',today=[],plan=[],follow=[];
  const WEEK=['日','一','二','三','四','五','六'];
  for(const ln of lines){
    const dm=ln.match(/(\d{1,2})月(\d{1,2})(日|号)?/);
    if(dm&&!date){
      date=dm[0]+(dm[3]?'':'日');
      const rest=ln.replace(/(\d{1,2})月(\d{1,2})(日|号)?/,'').trim();
      if(!rest)continue;               // 纯日期行
      today.push(ln);                  // 日期+内容同行：整行当内容
      continue;
    }
    if(/^(明天|明日|明早|明晚|明天去|明天上午|明天下午|明天晚上)/.test(ln)){plan.push(ln);continue;}
    if(/需要|待|跟进|问题|复查|报修|关注|整改|缺|没做|未做/.test(ln)){follow.push(ln);continue;}
    today.push(ln);
  }
  let out='';
  if(date){
    const m=date.match(/(\d{1,2})月(\d{1,2})(日|号)?/);
    const mm=parseInt(m[1],10)-1,dd=parseInt(m[2],10);
    const wd=WEEK[new Date(new Date().getFullYear(),mm,dd).getDay()];
    out+='时间：'+date+'（周'+wd+'）\n\n';
  }
  out+='今日工作：\n';
  if(today.length){today.forEach((t,i)=>{out+=(i+1)+'/'+t+'\n';});}
  else{out+='1/（无内容）\n';}
  out+='\n明日计划：\n';
  if(plan.length){plan.forEach((t,i)=>{out+=(i+1)+'/'+t+'\n';});}
  else{out+='1/待定\n';}
  if(follow.length){
    out+='\n待跟进：\n';
    follow.forEach((t,i)=>{out+='- '+t+'\n';});
  }
  return out;
}

// 口语→书面：去口头禅/语气词/冗余，标准化表达（语音转文字后带出/预览时用）
function drCleanTalk(t){
  let s=String(t==null?'':t).trim();
  if(!s)return s;
  s=s.replace(/^(那个|这个|就是|然后|其实|反正|感觉|有点|就是说|嗯|唉|哎呀|哦对|对了|那|还有|另外|然后就是|的话)\s*/,'');   // 行首口头禅
  s=s.replace(/[啊吧呢嘛哦哈呀啦]+$/,'');                                                             // 句尾语气词
  s=s.replace(/[啊吧呢嘛哦哈呀啦]，/g,'，');                                                          // 句中语气词（"灯箱啊，"→"灯箱，"）
  s=s.replace(/有点(漏|脏|乱|慢|难|破|旧|松|晃|响|咸|辣|淡|苦|酸|腻|贵|多|少)/g,'$1');               // "有点漏水"→"漏水"（不误伤"没有点火"）
  s=s.replace(/没(人|有)(处理|管理|跟进|维修|修理|清理|打扫|解决|整改|落实)/g,'未$2');                // 没人处理→未处理
  s=s.replace(/无人(处理|管理|跟进|维修|修理|清理|打扫|解决|整改|落实)/g,'未$1');
  s=s.replace(/没人$/g,'未处理');                                                                    // 截断版"长期没人"→"长期未处理"
  s=s.replace(/没有准备好/g,'未备好');
  s=s.replace(/没有(完成|落实|整改|解决|处理|跟进|准备|点火|开|摆|装|贴|挂|换|修|放|拿|洗|刷|擦)/g,'未$1');
  s=s.replace(/要准备好/g,'需备好');
  s=s.replace(/要(准备|搬|换|修|买|补|加|清|整|处理|跟进|落实|整改|解决|提升|改进|注意|关注|点|装|贴|挂|摆|洗|刷|擦)/g,'需$1');
  s=s.replace(/那边准备把它(点亮|修好|弄好|放好|关好|打开)/g,'并$1');
  s=s.replace(/那边把它(点亮|修好|弄好|放好|关好|打开)/g,'并$1');
  s=s.replace(/准备把它(点亮|修好|弄好|放好|关好|打开)/g,'并$1');
  s=s.replace(/的一个/g,'');
  s=s.replace(/那个/g,'').replace(/这个/g,'');
  s=s.replace(/他们/g,'').replace(/它们/g,'');
  s=s.replace(/[，,、；;]+$/,'');
  s=s.replace(/。+$/,'。');
  s=s.replace(/\s+/g,'');
  return s;
}
// 问题点分类：环境/服务/出品/其他（按关键词，先环境后服务再出品）
function drClassifyIssue(t){
  if(/(脏|异味|难看|乱|掉皮|脱落|漏水|渗|堵|塞|发霉|生锈|破损|垃圾桶|灯箱|卫生|地面|墙|天花板|洗手间|厕所|门窗|地板|地脚线|积灰|油污|水龙头|灯光|照明|招牌|台阶|电梯|空调|风扇|窗帘|地毯|墙面|角落|死角|气味|烟头|积水)/.test(t))return '环境';
  if(/(点火|打火机|工具|打招呼|培训|带客|送客|响应|态度|微笑|礼貌|上菜|服务|接待|咨客|摆台|备餐|备好|着装|仪容|精神|顾客|客人|话术|叫号|排队|翻台|撤台|补位|话术|对客|迎宾|欢送|茶水|骨碟)/.test(t))return '服务';
  if(/(鱼头|虾|菜品|菜|厨房|出品|味道|咸|辣|锅|米饭|汤|凉|热|新鲜|食材|冰箱|份量|摆盘|葱烧)/.test(t))return '出品';
  return '其他';
}
// 问题点列表按类别分组，生成带标题+序号的文本
function drClassifiedText(issues){
  const groups={环境:[],服务:[],出品:[],其他:[]};
  issues.forEach(i=>groups[drClassifyIssue(i)].push(i));
  const parts=[];
  for(const g of ['环境','服务','出品','其他']){
    if(groups[g].length)parts.push('【'+g+'】\n'+groups[g].map((l,i)=>(i+1)+'/'+l).join('\n'));
  }
  return parts.join('\n\n');
}
// 门店词表：5店全名+简称（去区域前缀），用于给日报问题点标注门店归属
const DR_ISSUE_RE=/(没有|没做|没完成|没到位|没处理|没解决|没落实|没整改|没执行|未做|未完成|未到位|未达标|未处理|未解决|未落实|未整改|未到岗|未执行|不干净|不规范|不到位|不合格|不达标|不新鲜|不及时|不主动|不热情|不耐烦|不整齐|不亮|不热|不冷|缺|脏|异味|难看|乱|坏|慢|差|漏|掉皮|脱落|渗|溢|堵|塞|发霉|生锈|破损|要准备|要搬|要换|要修|要买|要补|要加|要清|要整|要处理|要跟进|要落实|要整改|要解决|要提升|要改进|要注意|要关注|没人|无人|待跟进|待整改|待处理|待解决|整改|跟进|问题|投诉|报修|需要|建议|忘记|忘了)/;
const DR_STORE_NAMES=Object.keys(SV_NAMES||{});
const DR_STORE_CANON={};
DR_STORE_NAMES.forEach(n=>{DR_STORE_CANON[n]=n;DR_STORE_CANON[n.slice(2)]=n;});
const DR_STORE_RE=new RegExp('('+DR_STORE_NAMES.concat(DR_STORE_NAMES.map(n=>n.slice(2))).join('|')+')');
// 从日报提取问题点并标注门店归属：按行扫描门店词建立上下文（提到哪家店，其后问题行归哪家店；当天没提过门店的行归当天第一家店）
function drExtractRaw(dr){
  // 只取今天的日报：今天没有记录时，只认最近一条内容里写了今天日期（M月D）的记录，防止带出旧日报
  const out=[];
  const now=new Date();
  const todayKey=todayStr();
  const todayM=(now.getMonth()+1)+'月'+now.getDate();
  let raw='';
  const todayRec=dr&&dr[todayKey];
  if(todayRec&&(todayRec.raw||'').trim()){
    raw=todayRec.raw;
  }else{
    const ks=Object.keys(dr||{}).sort().reverse();
    for(const k of ks){
      const r=dr[k]||{};
      if((r.raw||'').includes(todayM)){raw=r.raw;break;}
    }
  }
  if(!raw)return out;
  let curStore=null,firstStore=null;
  raw.split('\n').forEach(l=>{
    const t=l.trim();if(!t)return;
    const sm=t.match(DR_STORE_RE);
    if(sm){curStore=DR_STORE_CANON[sm[1]];if(!firstStore)firstStore=curStore;}
    if(/^\d{1,2}月\d{1,2}(日|号)?/.test(t))return;      // 日期行
    if(/^(今日工作|明日计划|待跟进|时间：)/.test(t))return; // 标题行
    if(/^(明日|明天|明早|明晚)/.test(t))return;          // 计划行
    if(/^\d+[/、．.]\s*/.test(t))return;                  // 编号行
    if(/问题点$/.test(t)&&t.length<=10)return;            // "巡店问题点"这类小标题
    if(!DR_ISSUE_RE.test(t))return;
    const t2=drCleanTalk(t).replace(/连续[0-9一二三四五六七八九十]+次/,'连续多次').replace(/^今日问题/,'').trim(); // 口语转书面+归一化（连续N次、今日问题前缀）
    if(!t2)return;
    out.push({t:t2,store:curStore||firstStore||null});
  });
  // 去重（保首现）
  const seen=new Set();const uniq=[];
  out.forEach(x=>{if(!seen.has(x.t)){seen.add(x.t);uniq.push(x);}});
  return uniq;
}
function drExtractIssues(dr,store){
  const items=drExtractRaw(dr);
  if(!store)return items.map(x=>x.t);
  // 只带当前店的问题点；当天完全没提过门店的行视为通用（兼容单店天），其余店的跳过
  const kept=items.filter(x=>x.store===store||!x.store).map(x=>x.t);
  const other={};let otherCount=0;
  items.forEach(x=>{if(x.store&&x.store!==store){other[x.store]=(other[x.store]||0)+1;otherCount++;}});
  kept._stats={other,otherCount};
  return kept;
}
async function drPullIssues(){
  const curStore=(svDraft&&svDraft.store)||'';
  let issues=[];
  try{
    const r=await fetch('/dashboard/api/workflow');const j=await r.json();
    issues=drExtractIssues((j.data&&j.data.dr)||{},curStore);
  }catch(e){issues=drExtractIssues((load().dr)||{},curStore);}
  const stats=issues._stats||null;
  if(!issues.length){
    if(stats&&stats.otherCount>0){toast('日报里没有「'+curStore+'」的问题点（'+Object.keys(stats.other).join('、')+' '+stats.otherCount+' 条已按店跳过）');}
    else{toast('今天的日报里没识别到问题点');}
    return;
  }
  // 已有行去分类标题、去旧序号、口语统一后比较（"长期没人/长期没人处理/长期未处理"都归一为"长期未处理"）
  const _norm=l=>l.replace(/[。，、；：！？\s]/g,'');
  const curLines=(svDraft.notes.wenti||'').trim().split('\n').map(l=>l.trim()).filter(l=>l&&!/^【.+】$/.test(l)).map(l=>l.replace(/^\d+\//,'')).filter(Boolean).map(drCleanTalk);
  const curKeys=curLines.map(_norm);
  const fresh=issues.filter(i=>!curKeys.includes(_norm(i)));
  if(!fresh.length){toast('问题点已在记录里，无需重复带出');return;}
  // 全部行按环境/服务/出品分类，各类内编序号（先归一化去重）
  const allLines=[...curLines,...fresh];
  const _seen=new Set();const _uniq=[];
  allLines.forEach(l=>{const k=_norm(l);if(!_seen.has(k)){_seen.add(k);_uniq.push(l);}});
  svDraft.notes.wenti=drClassifiedText(_uniq);
  localStorage.setItem('zm_sv_draft',JSON.stringify(svDraft));
  drIssueState=null;   // 已全部带入，隐藏提示条
  renderSV();
  toast('✅ 已带出 '+fresh.length+' 个问题点（'+curStore+'）'+(stats&&stats.otherCount>0?'，跳过其他店 '+stats.otherCount+' 条':'')+'，可编辑后保存');
}

// textarea 随内容自动增高
function autoGrow(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.max(el.scrollHeight,60)+'px';
}
// 自动检测日报问题点：结果缓存到 drIssueState（渲染时按缓存显示，避免重建 DOM 丢提示）
let drCheckTs=0;
let drIssueState=null;   // {count:N} 有未带入；null 无
async function drCheckIssues(){
  const now=Date.now();
  if(now-drCheckTs<15000)return;
  drCheckTs=now;
  const curStore=(svDraft&&svDraft.store)||'';
  let issues=[];
  try{
    const r=await fetch('/dashboard/api/workflow');const j=await r.json();
    issues=drExtractIssues((j.data&&j.data.dr)||{},curStore);
  }catch(e){return;}
  if(!issues.length){drIssueState=null;return;}
  // 已有行去分类标题、去旧序号、口语统一后比较（wenti 里是"【环境】/1/鱼头未点火。"，issues 里是"鱼头未点火。"）
  const _norm=l=>l.replace(/[。，、；：！？\s]/g,'');
  const curLines=(svDraft.notes.wenti||'').trim().split('\n').map(l=>l.trim()).filter(l=>l&&!/^【.+】$/.test(l)).map(l=>l.replace(/^\d+\//,'')).filter(Boolean).map(drCleanTalk);
  const curKeys=curLines.map(_norm);
  const fresh=issues.filter(i=>!curKeys.includes(_norm(i)));
  drIssueState=fresh.length?{count:fresh.length}:null;
  const el=document.getElementById('drIssueHint');
  if(!el)return;
  if(drIssueState&&drIssueState.count>0){
    el.style.display='block';
    el.textContent='📥 日报发现 '+drIssueState.count+' 个问题点（'+curStore+'）未带入，点此一键带入';
  }else{
    el.style.display='none';
  }
}
function toggleTopMore(){
  const m=document.getElementById('topMoreMenu');

}
function hideTopMore(){
  const m=document.getElementById('topMoreMenu');

}
document.addEventListener('click',function(e){

function boot(){

  document.body.appendChild(el);

  ss.textContent='@keyframes splashPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}@keyframes splashFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}';
  document.head.appendChild(ss);
  renderAll();
  initSections();
  initTab();
  drLoad();
  
  fetch('/dashboard/api/workflow').then(r=>r.json()).then(j=>{
    if(j.data&&Object.keys(j.data).length>0){
      try{
        const merged=mergeServerData(j.data,JSON.parse(localStorage.getItem(KEY))||{});
        localStorage.setItem(KEY,JSON.stringify(merged));
        renderAll();
      }catch(e){/*ignore*/}
    }
  }).catch(()=>{});
  // 每60秒从服务器拉一次最新数据（跨设备同步）
  setInterval(refreshFromServer, 60000);
  setInterval(function(){var s=load();s._date=s._date||'';var t=todayStr();if(s._date&&s._date!==t){s.mu={};s.dy={};s.wk={};s._date=t;save(s);renderAll();}},60000);
}
boot();
